<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabarKini - Portal Berita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav-wrapper">
            <h1 class="brand">Kabar<span>Kini.</span></h1>
            <nav class="categories" id="category-filters">
                <button class="filter-btn active" data-category="semua">Semua</button>
                <button class="filter-btn" data-category="teknologi">Teknologi</button>
                <button class="filter-btn" data-category="olahraga">Olahraga</button>
                <button class="filter-btn" data-category="gaya-hidup">Gaya Hidup</button>
            </nav>
            <div class="header-actions">
                <input type="text" id="search-input" class="search-input" placeholder="Cari berita...">
                <button id="theme-toggle" class="theme-btn">🌙</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="headline" id="headline-container"></section>

        <section class="news-section">
            <h2 class="section-title">Berita Terbaru</h2>
            <div class="news-grid" id="news-grid"></div>
        </section>
    </main>

    <div id="article-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <span id="modal-category" class="badge"></span>
            <h2 id="modal-title"></h2>
            <p id="modal-meta" class="meta"></p>
            <img id="modal-image" src="" alt="Gambar Berita">
            <p id="modal-body" class="article-text"></p>
            <div class="modal-actions">
                <button id="share-btn" class="share-btn">🔗 Salin Info Berita</button>
                <span id="share-status" class="share-status"></span>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; <span id="year"></span> KabarKini Media.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
